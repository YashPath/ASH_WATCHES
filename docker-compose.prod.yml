# Production overlay: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# Adds Caddy (automatic HTTPS) as the only public entry point. The local nginx edge is under the "local" profile and stays off.
services:
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api, web]
    networks: [edge]
volumes:
  caddy_data: {}
  caddy_config: {}
