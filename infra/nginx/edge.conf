# Edge reverse proxy: / -> web, /api and /media-public -> api (so rate limiting sees the real client IP via X-Forwarded-For).
limit_req_zone $binary_remote_addr zone=api_zone:10m rate=20r/s;
upstream web { server web:3000; keepalive 16; }
upstream api { server api:4000; keepalive 16; }
server {
  listen 80;
  server_tokens off;
  client_max_body_size 12m;
  add_header X-Content-Type-Options nosniff always;
  # Terminate TLS in front of this (cloud LB / Caddy / certbot). Stripe webhooks need the raw body, so no buffering tricks here.
  location /api/ {
    limit_req zone=api_zone burst=40 nodelay;
    proxy_pass http://api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location /media-public/ { proxy_pass http://api; proxy_set_header Host $host; }
  location / {
    proxy_pass http://web;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
